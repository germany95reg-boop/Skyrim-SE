name: Skyrim SE Mobile Vulkan 3D APK v2.14 — driver fallback for DDS
on:
  push:
    branches: [main, development/v2.14-vulkan-fallback]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate signing, icon, version and selected-part contracts
        run: |
          python3 mobile/tests/release_signing_contract_test.py
          python3 mobile/tests/v213_contract_test.py
          python3 mobile/tests/v214_vulkan_fallback_contract_test.py
          test -s .ci/skyrimse-mobile-test.jks
          keytool -list -v -keystore .ci/skyrimse-mobile-test.jks -storepass android -alias androiddebugkey | grep -F '16:B9:F1:0C:71:FE:29:0E:44:55:DF:39:B9:34:4B:9B:8B:28:24:79:F5:B0:A1:35:F3:58:49:7E:59:3B:B2:D7'
      - name: JVM regression — exact NIF part to DDS references and composite atlas
        working-directory: mobile
        run: |
          mkdir -p /tmp/skyrim-v212-links
          javac -encoding UTF-8 -d /tmp/skyrim-v212-links \
            app/src/main/java/dev/skyrimsemobile/launcher/BsaCatalogReader.java \
            app/src/main/java/dev/skyrimsemobile/launcher/DdsArchiveFinder.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifBlockInspector.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifMaterialInspector.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifMaterialLinkInspector.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifPartTextureSelection.java \
            app/src/main/java/dev/skyrimsemobile/launcher/DdsHeaderInspector.java \
            app/src/main/java/dev/skyrimsemobile/launcher/DdsBcDecoder.java \
            app/src/main/java/dev/skyrimsemobile/launcher/DdsNormalResampler.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifCompositeDdsAtlas.java \
            app/src/main/java/dev/skyrimsemobile/launcher/ObjWireParser.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifGeometryDecoder.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifSceneComposer.java \
            app/src/main/java/dev/skyrimsemobile/launcher/NifPartDdsAvailability.java \
            tests/NifGeometryDecoderTest.java \
            tests/NifMaterialInspectorTest.java \
            tests/NifMaterialLinkInspectorTest.java \
            tests/NifPartDdsAvailabilityTest.java \
            tests/NifPartTextureSelectionTest.java \
            tests/NifCompositeDdsAtlasTest.java \
            tests/DdsNormalResamplerTest.java
          java -cp /tmp/skyrim-v212-links dev.skyrimsemobile.launcher.NifMaterialLinkInspectorTest
          java -cp /tmp/skyrim-v212-links dev.skyrimsemobile.launcher.NifPartDdsAvailabilityTest
          java -cp /tmp/skyrim-v212-links dev.skyrimsemobile.launcher.NifPartTextureSelectionTest
          java -cp /tmp/skyrim-v212-links dev.skyrimsemobile.launcher.NifCompositeDdsAtlasTest
          java -cp /tmp/skyrim-v212-links dev.skyrimsemobile.launcher.DdsNormalResamplerTest

      - name: Install Android SDK and shader compiler with CMake retries
        shell: bash
        run: |
          set -euo pipefail
          # The GitHub runner occasionally receives an incomplete CMake ZIP.
          # Install the other SDK components first; retry just CMake if needed.
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          if [ ! -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ]; then
            success=0
            for attempt in 1 2 3; do
              echo "CMake 3.22.1 SDK attempt $attempt/3"
              if timeout 160s sdkmanager --install "cmake;3.22.1"; then
                success=1
                break
              fi
              rm -rf "$ANDROID_HOME/cmake/3.22.1"
              sleep 5
            done
            if [ "$success" -ne 1 ]; then
              echo "CMake SDK download failed after three attempts"
              exit 1
            fi
          fi
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools spirv-tools
      - name: Compile Vulkan GLSL to SPIR-V
        run: |
          glslangValidator -V --target-env vulkan1.0 -S vert \
            mobile/app/src/main/shaders/cube.vert \
            -o mobile/app/src/main/assets/cube.vert.spv
          glslangValidator -V --target-env vulkan1.0 -S frag \
            mobile/app/src/main/shaders/cube.frag \
            -o mobile/app/src/main/assets/cube.frag.spv
          glslangValidator -V --target-env vulkan1.0 -S frag \
            mobile/app/src/main/shaders/solid.frag \
            -o mobile/app/src/main/assets/solid.frag.spv
          glslangValidator -V --target-env vulkan1.0 -S vert \
            mobile/app/src/main/shaders/textured.vert \
            -o mobile/app/src/main/assets/textured.vert.spv
          glslangValidator -V --target-env vulkan1.0 -S frag \
            mobile/app/src/main/shaders/textured.frag \
            -o mobile/app/src/main/assets/textured.frag.spv
          glslangValidator -V --target-env vulkan1.0 -S vert \
            mobile/app/src/main/shaders/textured_safe.vert \
            -o mobile/app/src/main/assets/textured_safe.vert.spv
          glslangValidator -V --target-env vulkan1.0 -S frag \
            mobile/app/src/main/shaders/textured_safe.frag \
            -o mobile/app/src/main/assets/textured_safe.frag.spv
          glslangValidator -V --target-env vulkan1.0 -S frag \
            mobile/app/src/main/shaders/textured_legacy.frag \
            -o mobile/app/src/main/assets/textured_legacy.frag.spv
          for spv in mobile/app/src/main/assets/*.spv; do
            spirv-val --target-env vulkan1.0 "$spv"
          done
      - name: Build signed debug APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK is signed with the persistent development certificate
        run: |
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -Fi "16b9f10c71fe290e4455df39b9344b9b8b282479f5b0a135f358497e593bb2d7"
      - name: Upload signed Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-SE-Vulkan-3D-v2.14-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

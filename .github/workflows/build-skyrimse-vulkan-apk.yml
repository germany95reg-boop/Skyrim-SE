name: Skyrim SE Mobile Vulkan 3D APK v0.8
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack v0.8 source
        run: |
          mkdir -p SkyrimSEMobileLauncher_v0.8
          base64 --decode .skyrimse-v08-source.tar.xz.b64 | tar -xJf - -C SkyrimSEMobileLauncher_v0.8
      - name: Validate BSA v105 parser and inspector contracts
        working-directory: SkyrimSEMobileLauncher_v0.8
        run: |
          mkdir -p /tmp/skyrim-bsa-tests
          javac -d /tmp/skyrim-bsa-tests app/src/main/java/dev/skyrimsemobile/launcher/BsaCatalogReader.java tests/BsaCatalogReaderTest.java
          java -cp /tmp/skyrim-bsa-tests BsaCatalogReaderTest
          python3 tests/resource_v08_contract_test.py
      - name: Install Android SDK and shader compiler
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
      - name: Compile Vulkan GLSL to SPIR-V
        run: |
          glslangValidator -V --target-env vulkan1.0 -S vert \
            SkyrimSEMobileLauncher_v0.8/app/src/main/shaders/cube.vert \
            -o SkyrimSEMobileLauncher_v0.8/app/src/main/assets/cube.vert.spv
          glslangValidator -V --target-env vulkan1.0 -S frag \
            SkyrimSEMobileLauncher_v0.8/app/src/main/shaders/cube.frag \
            -o SkyrimSEMobileLauncher_v0.8/app/src/main/assets/cube.frag.spv
      - name: Build signed debug APK
        working-directory: SkyrimSEMobileLauncher_v0.8
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload Vulkan 3D test APK
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-SE-Vulkan-3D-v0.8-APK
          path: SkyrimSEMobileLauncher_v0.8/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

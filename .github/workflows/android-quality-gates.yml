name: Skyrim SE — automated quality gates (tests, Vulkan, APK, Android UI)
on:
  push:
    branches: [main, development/ci-automated-quality-gates]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyrim-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-regressions:
    name: Fast NIF / BSA / DDS regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download project's pinned LZ4 dependency through Gradle
        run: gradle --no-daemon -p mobile :app:dependencies --configuration debugRuntimeClasspath > /tmp/skyrim-gradle-dependencies.log
      - name: Run ALL pure-Java regression programs, fail fast
        run: bash mobile/ci/run_jvm_suite.sh
      - name: Validate current UI, Vulkan source, assets and upgrade identity
        run: |
          python3 mobile/tests/v213_contract_test.py
          python3 mobile/tests/release_signing_contract_test.py
          python3 mobile/tests/ci_quality_contract_test.py

  android-arm64-apk:
    name: Compile Vulkan / sign / inspect ARM64 APK
    needs: jvm-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up NDK, CMake, build tools and compile Vulkan SPIR-V
        run: bash mobile/ci/setup_android_build.sh
      - name: Build release-candidate test APK (ARM64 only)
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK version, Android package, ABI, shaders and signing
        run: bash mobile/ci/verify_apk.sh mobile/app/build/outputs/apk/debug/app-debug.apk
      - name: Save tested APK for internal integration (not a user release)
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-SE-v2.13-CI-ARM64-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  android-emulator-ui:
    name: Android emulator — real UI callbacks and lifecycle
    needs: android-arm64-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Allow Linux KVM acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build x86_64 emulator-only native test variant and shaders
        run: bash mobile/ci/setup_android_build.sh
      - name: Run Android instrumented UI smoke tests without Skyrim assets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # Override AVD config itself, as well as the emulator boot flag below.
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          # Default API 35 userdata >7 GB fails on stock hosted runners.
          # A 2 GB userdata partition is sufficient for our no-game-asset UI tests.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics -gpu swiftshader_indirect -partition-size 2048
          script: cd mobile && gradle --no-daemon --stacktrace -PciEmulator=true :app:connectedDebugAndroidTest
      - name: Keep Android test results for failure analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-SE-Android-emulator-test-results
          path: |
            mobile/app/build/outputs/androidTest-results/connected/
            mobile/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7

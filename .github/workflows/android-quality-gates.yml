name: Skyrim SE — automatic JVM/Vulkan/APK checks + on-phone self-test
on:
  push:
    branches: [main] # feature changes are validated once, through pull_request
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and PR checks for the same branch share one job group: no duplicate builds.
  group: skyrim-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  jvm-regressions:
    name: Fast NIF / BSA / DDS regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download project's pinned LZ4 dependency through Gradle
        run: gradle --no-daemon -p mobile :app:resolveRuntimeJars
      - name: Run ALL pure-Java regression programs, fail fast
        run: bash mobile/ci/run_jvm_suite.sh
      - name: Validate current UI, Vulkan source, assets and upgrade identity
        run: |
          python3 mobile/tests/v213_contract_test.py
          python3 mobile/tests/v214_vulkan_fallback_contract_test.py
          python3 mobile/tests/v215_device_autotest_contract_test.py
          python3 mobile/tests/v216_fps_matrix_contract_test.py
          python3 mobile/tests/v217_nif_hierarchy_contract_test.py
          python3 mobile/tests/v218_normal_atlas_contract_test.py
          python3 mobile/tests/v219_paired_material_contract_test.py
          python3 mobile/tests/v220_frame_pixelcopy_contract_test.py
          python3 mobile/tests/v221_dds_alpha_contract_test.py
          python3 mobile/tests/v222_pixel_footprint_contract_test.py
          python3 mobile/tests/v223_geometry_camera_contract_test.py
          python3 mobile/tests/release_signing_contract_test.py
          python3 mobile/tests/ci_quality_contract_test.py

  android-arm64-apk:
    name: Compile Vulkan / sign / inspect ARM64 APK
    needs: jvm-regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up NDK, CMake, build tools and compile Vulkan SPIR-V
        run: bash mobile/ci/setup_android_build.sh
      - name: Build release-candidate test APK (ARM64 only)
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK version, Android package, ABI, shaders and signing
        run: bash mobile/ci/verify_apk.sh mobile/app/build/outputs/apk/debug/app-debug.apk
      - name: Save tested APK for internal integration (not a user release)
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-SE-v2.23-CI-ARM64-APK
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error


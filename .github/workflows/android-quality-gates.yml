name: Skyrim SE — automatic JVM/Vulkan/APK checks + on-phone self-test
on:
  push:
    branches: [main] # feature changes are validated once, through pull_request
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and PR checks for the same branch share one job group: no duplicate builds.
  group: skyrim-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Python source and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contracts before Android setup
        id: source-contracts
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in mobile/tests/*contract_test.py; do
            echo "::group::$test"
            if python3 "$test"; then
              echo "PASS $test"
            else
              echo "::error file=$test,title=Source contract failed::Inspect assertion output for $test"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "Source contracts failed: $failed" >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0

  jvm-regressions:
    name: Fast NIF / BSA / DDS regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download project's pinned LZ4 dependency through Gradle
        id: lz4
        run: gradle --no-daemon -p mobile :app:resolveRuntimeJars
      - name: Record dependency and JVM stage diagnostics
        if: always()
        env:
          LZ4: ${{ steps.lz4.outcome }}
        run: |
          echo "### v2.51 CI checkpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "Gradle LZ4 resolution: $LZ4" >> "$GITHUB_STEP_SUMMARY"
          echo "A skipped stage is not a pass." >> "$GITHUB_STEP_SUMMARY"
      - name: Run ALL pure-Java regression programs, fail fast
        run: bash mobile/ci/run_jvm_suite.sh

  android-arm64-apk:
    name: Compile Vulkan / sign / inspect ARM64 APK
    permissions:
      contents: write # only this job may publish the private test release
    needs: [jvm-regressions, source-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up NDK, CMake, build tools and compile Vulkan SPIR-V
        run: bash mobile/ci/setup_android_build.sh
      - name: Build release-candidate test APK (ARM64 only)
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK version, Android package, ABI, shaders and signing
        run: bash mobile/ci/verify_apk.sh mobile/app/build/outputs/apk/debug/app-debug.apk
      # Actions Artifacts storage reached its quota in v2.42.
      # Private repository prerelease assets use GitHub Releases instead;
      # publishing is forbidden for pull_request events.
      - name: Publish signed test APK to GitHub Releases (private prerelease)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          TAG="skyrim-se-mobile-v2.51.0"
          ASSET="Skyrim-SE-Mobile-v2.51.0-ARM64.apk"
          test -s "$APK"
          cp "$APK" "$ASSET" # GitHub CLI #suffix sets a label, not the asset filename.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Skyrim SE Mobile v2.51.0 (ARM64 test APK)" \
              --notes "Signed test build of the diagnostic Skyrim SE Mobile Vulkan/NIF viewer. Not a playable SkyrimSE.exe port. APK package and testing certificate unchanged. PixelCopy only samples surface evidence; verify on a physical Android device." \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"


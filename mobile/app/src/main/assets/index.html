<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#101115" />
<title>Skyrim SE Mobile Launcher</title>
<style>
:root {color-scheme:dark;--bg:#0b0c11;--panel:#17191f;--panel2:#242630;--stroke:#60606e;--light:#f4f1fa;--muted:#aaa9b8;--lav:#c5ade8;--lavDeep:#8a75aa;--glow:rgba(194,166,234,.25);--green:#88daa9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Roboto,'Noto Sans',Arial,sans-serif;color:var(--light);background:var(--bg)}body{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
#shell{display:flex;flex-direction:column;height:100%;min-height:0;max-width:1200px;margin:auto;padding:0 12px 9px;gap:8px;background:linear-gradient(120deg,#0b0d13,#14151d 45%,#0a0b10)}
header{position:relative;flex:0 0 auto;height:113px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
header::before{content:"";position:absolute;inset:0 0 -30px;background:linear-gradient(90deg,transparent 0%,#252837 50%,transparent 100%);clip-path:polygon(0% 100%,0 80%,10% 35%,19% 78%,30% 44%,40% 85%,49% 29%,60% 85%,72% 42%,83% 76%,94% 24%,100% 72%,100% 100%);opacity:.62;z-index:-1}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,#101116 100%);z-index:-1}
.brand{display:flex;align-items:center;gap:14px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(25px,5vw,41px);letter-spacing:.22em;white-space:nowrap;text-shadow:0 1px 5px #111}.crest{font-size:33px;color:#cfd0df;letter-spacing:0}.sub{margin-top:0;font:14px Georgia,serif;letter-spacing:.6em;margin-left:.7em}
.tabs{display:flex;flex:0 0 auto;align-self:center;width:100%;max-width:850px;gap:5px;height:50px}.tab{flex:1;border-radius:15px;border:1.5px solid #767583;color:#ededf4;background:linear-gradient(#26282e,#171920);font-weight:700;font-size:17px;box-shadow:inset 0 0 0 1px #22242a}.tab.active{border-color:#e3caef;background:linear-gradient(#e1cefa,#b29acb);color:#18141e;box-shadow:0 0 13px #b48dda33}.tab .ico{margin-right:9px}
#content{min-height:0;flex:1;border:1.5px solid #85828e;border-radius:20px;background:linear-gradient(135deg,#1a1c23,#101116 62%,#161820);overflow:hidden;box-shadow:inset 0 0 10px #0008;position:relative}
.section-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#b5adc4 #30313b;scrollbar-width:thin;padding:16px}.section-scroll::-webkit-scrollbar{width:7px}.section-scroll::-webkit-scrollbar-thumb{background:#b5adc4;border-radius:8px}.section-scroll::-webkit-scrollbar-track{background:#30313b}
.section-heading{font-size:21px;font-weight:700;margin:0 0 2px;display:flex;align-items:center;gap:12px}.section-heading .ico{color:var(--lav);font-size:27px}.note{margin:3px 0 12px 40px;color:var(--muted);font-size:13px}.divider{height:1px;background:#464750;margin:15px 0}.group-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px;margin:8px 0 12px}.group-title .ico{font-size:24px;color:var(--lav)}
.modlist{display:flex;flex-direction:column}.modrow{display:flex;gap:10px;align-items:center;padding:10px 4px;min-height:66px;border-bottom:1px solid #383a43}.modrow .glyph{background:#2a2a33;color:#c9b0e8;width:40px;height:42px;display:grid;place-items:center;border-radius:10px;font-size:21px;flex-shrink:0}.modrow .info{flex:1;min-width:0}.modrow strong{display:block;font-size:15px;overflow-wrap:anywhere}.modrow small{color:var(--muted);font-size:12px;display:block;margin-top:3px}.modrow .actions{display:flex;gap:7px;align-items:center}.tiny{background:#292a33;border:1px solid #555561;color:#e7e0ef;border-radius:9px;padding:5px 8px;font-size:13px}.switch{appearance:none;-webkit-appearance:none;width:51px;height:29px;border:1px solid #70707c;border-radius:20px;background:linear-gradient(#41434b,#292b32);position:relative;vertical-align:middle;cursor:pointer;flex-shrink:0}.switch:before{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#c5c3cd;box-shadow:0 1px 2px #0007;transition:transform .18s}.switch:checked{background:linear-gradient(#cdb5e7,#a78ac6);border-color:#ead7ff}.switch:checked:before{background:#fff;transform:translateX(22px)}
.empty{padding:26px 14px;border:1px dashed #656272;border-radius:14px;text-align:center;color:#c6c0cf;font-size:14px;line-height:1.6;margin:15px 0}.empty .ico{display:block;font-size:28px;margin-bottom:4px}.action{border:1.5px solid #c9a9e7;background:linear-gradient(#38303f,#262431);border-radius:13px;min-height:47px;color:#f3ecfa;font-size:16px;font-weight:700;padding:10px 14px;width:100%;margin:8px 0}.action:hover{background:#46374f}.action.secondary{border-color:#555467;background:linear-gradient(#292b34,#1a1d24)}.split{display:flex;align-items:center;gap:10px;justify-content:space-between}.tile{border-top:1px solid #434550;padding:11px 4px;display:flex;align-items:center;gap:10px;min-height:63px}.tile .iconbox{font-size:23px;color:var(--lav);width:39px;text-align:center}.tile .copy{flex:1;min-width:0}.tile strong{display:block;font-size:15px}.tile small{display:block;color:#b9b7c3;font-size:12px;margin-top:4px}.tile .chev{font-size:20px;color:#c6b3df}.info-panel{border:1px solid #585164;border-radius:13px;background:#24212b;padding:13px;font-size:13px;color:#ded5e5;line-height:1.5;margin-top:10px}.info-panel strong{color:#d5afea}.muted{color:var(--muted)}
.field{margin:8px 0 14px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field small{color:#b2aebc;display:block;margin-top:5px}.folder-line{font-size:13px;color:#d1cbd9;border:1px solid #3e414f;background:#262932;padding:10px;border-radius:10px;word-break:break-all}.folder-line.invalid{color:#cdb1d8}.form-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}.form-row label{font-size:14px;flex:1}.control{background:#242730;color:#eee;border:1px solid #555665;border-radius:9px;padding:9px 10px;width:min(55%,220px);min-width:100px}.control:focus{border-color:#c9b0e8}.status-line{font-size:12px;color:#c5bed1;line-height:1.5;margin-top:7px}
footer{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:8px;min-height:93px;padding:8px 5px 0;border-top:1px solid #3b3d46}.status{display:flex;align-items:center;justify-content:center;gap:6px;color:#d7cbdc;font-size:13px;text-align:center}.status b{color:#c49de4}.play{height:55px;border:2px solid #888793;background:linear-gradient(#44464f,#282a32);border-radius:17px;color:#aeabb8;font-size:19px;font-weight:700}.play:disabled{cursor:not-allowed;opacity:.85}.play:not(:disabled){background:linear-gradient(#d5bff1,#a994cf);border-color:#e8d7f6;color:#191520}.warn{font-size:12px;color:#d7b7e6;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;max-width:min(90vw,500px);padding:11px 17px;background:#32283f;border:1px solid #aa8ec4;border-radius:12px;box-shadow:0 7px 32px #000;z-index:20;display:none;text-align:center;font-size:13px}#toast.error{border-color:#da9696;background:#422a30}
.demo{color:#d3b1e7;text-align:center;font-size:11px;padding:3px 0}.landing{padding:13px}
@media (orientation:landscape) and (min-width:650px){#shell{padding:0 14px 7px;gap:5px}header{height:58px}.brand{font-size:27px}.crest{font-size:23px}.sub{font-size:10px}.tabs{height:39px;max-width:850px}.tab{font-size:14px;border-radius:13px}footer{height:61px;min-height:61px;flex-direction:row;align-items:center;justify-content:space-between;padding:6px 0;gap:12px}.play{height:48px;width:min(36%,360px);order:0;font-size:16px}.status{order:1;flex:1;font-size:13px}#content{border-radius:18px}.section-scroll{padding:12px 15px}.mods-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,0.9fr);gap:14px;min-height:100%}.mods-layout .mod-column{border-right:1px solid #42434d;padding-right:12px}.settings-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.settings-layout .settings-column:first-child{border-right:1px solid #42434d;padding-right:16px}.note{margin-bottom:6px}.modrow{min-height:45px;padding:4px 2px}.modrow .glyph{width:34px;height:34px;font-size:18px}.modrow strong{font-size:13px}.modrow small{font-size:11px}.section-heading{font-size:17px}.section-heading .ico{font-size:20px}.group-title{font-size:17px;margin:4px 0 10px}.action{min-height:38px;margin:6px 0;font-size:14px}.tile{min-height:51px}.info-panel{font-size:12px;padding:10px}.field{margin:4px 0 10px}.form-row{margin:7px 0}#toast{bottom:76px}}
@media (max-width:350px){.brand{font-size:22px;letter-spacing:.12em}.crest{font-size:20px}.tab{font-size:14px}.section-scroll{padding:12px}.modrow{gap:6px}.tiny{padding:5px 6px}.modrow .glyph{width:32px}}
@media (prefers-reduced-motion:reduce){*,*:before{transition:none!important;scroll-behavior:auto!important}}
/* v0.2 device health dashboard inside the existing scrollable settings panel */
.diag-card{border:1px solid #71667e;background:#24222d;border-radius:14px;padding:12px 13px;margin:8px 0}
.diag-title{font-weight:700;color:#dfc4f7;font-size:14px;margin-bottom:9px}
.diag-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid #3d3a47;font-size:12px}
.diag-row span:first-child{color:#bdb6cb}.diag-row b{text-align:right;font-weight:600;overflow-wrap:anywhere;max-width:69%}
.diag-note{font-size:12px;line-height:1.45;color:#bcb3c9;margin-top:9px}
.diag-ok{color:#90d8ae}.diag-no{color:#e4b2b7}.diag-pending{color:#dac4e7}
@media (orientation:landscape) and (max-height:420px){header{height:44px}.tabs{height:35px}footer{height:56px;min-height:56px}.play{height:42px}}
</style>
</head>
<body>
<div id="shell">
  <header aria-label="Skyrim SE Mobile"><div class="brand"><span class="crest">◇</span><span>SKYRIM SE</span><span class="crest">◇</span></div><div class="sub">MOBILE</div></header>
  <nav class="tabs" aria-label="Разделы"><button id="modsTab" class="tab active" onclick="selectTab('mods')" aria-selected="true"><span class="ico">✥</span>Моды</button><button id="settingsTab" class="tab" onclick="selectTab('settings')" aria-selected="false"><span class="ico">⚙</span>Настройки</button></nav>
  <main id="content" aria-live="polite"><div class="section-scroll" id="scroll"><div id="view"></div></div></main>
  <footer><div class="status">ⓘ &nbsp; Нативный движок: <b id="engineStatus">не подключён</b></div><button class="play" id="play" onclick="playGame()" disabled>▶ &nbsp; Играть</button></footer>
</div>
<div id="toast" role="status"></div><input type="file" id="previewZip" accept=".zip,application/zip" style="display:none" onchange="previewImport(event)" />
<script>
const isAndroid = typeof AndroidBridge !== 'undefined';
const DEMO_MODS = [
  {id:'demo1',name:'Enhanced Landscapes (пример)',enabled:true,files:31},
  {id:'demo2',name:'Immersive Weapons (пример)',enabled:true,files:18},
  {id:'demo3',name:'Realistic Weather (пример)',enabled:true,files:25},
  {id:'demo4',name:'Expanded Settlements (пример)',enabled:false,files:12}
];
const INITIAL = {gameFolder:'',folderStatus:'Папка игры не выбрана',exeValidation:'EXE ещё не проверен',folderReady:false,engineConnected:false,frameTest:null,sceneTest:null,runtime:{state:'not_checked',arm64:false,nativeLibraryLoaded:false,vulkanLoader:false,vulkan11:false,gpuCount:0,gpuName:'',apiVersion:'',message:'Диагностика ещё не запускалась'},mods:DEMO_MODS,settings:{resolution:'1280 × 720',quality:'Среднее',msaa:false,anisotropic:true,touch:true,fps:'30'}};
let data = JSON.parse(JSON.stringify(INITIAL));
function savedTab(){try{return localStorage.getItem('launcher_tab')||'mods';}catch(_){return 'mods';}}
function rememberTab(t){try{localStorage.setItem('launcher_tab',t);}catch(_){}}
let currentTab = savedTab();
let scrollPositions = {mods:0,settings:0};
let toastTimeout;
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function notify(message,error=false){const el=document.getElementById('toast');el.textContent=message;el.classList.toggle('error',error);el.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.style.display='none',3700);}
function requestState(){if(isAndroid){try{receiveState(JSON.parse(AndroidBridge.getState()));}catch(e){notify('Ошибка получения состояния: '+e.message,true);}}}
function receiveState(obj){data={...INITIAL,...obj,settings:{...INITIAL.settings,...(obj.settings||{})},mods:obj.mods||[]};render();}
function selectTab(tab){if(!['mods','settings'].includes(tab))return;scrollPositions[currentTab]=document.getElementById('scroll').scrollTop;currentTab=tab;rememberTab(tab);render();document.getElementById('scroll').scrollTop=scrollPositions[tab]||0;}
function render(){const activeScroll=document.getElementById('scroll');const oldScroll=activeScroll.scrollTop;document.getElementById('modsTab').classList.toggle('active',currentTab==='mods');document.getElementById('settingsTab').classList.toggle('active',currentTab==='settings');document.getElementById('modsTab').setAttribute('aria-selected',String(currentTab==='mods'));document.getElementById('settingsTab').setAttribute('aria-selected',String(currentTab==='settings'));document.getElementById('view').innerHTML=currentTab==='mods'?modsView():settingsView();document.getElementById('engineStatus').textContent=data.engineConnected?'подключён':'не подключён';document.getElementById('play').disabled=!(data.engineConnected&&data.folderReady);activeScroll.scrollTop=oldScroll;}
function modsView(){const enabled=data.mods.filter(m=>m.enabled).length;let rows=data.mods.length?data.mods.map((m,i)=>`<div class="modrow"><div class="glyph">▱</div><div class="info"><strong>${escapeHtml(m.name)}</strong><small>${m.files||0} файлов · ${m.enabled?'включён в профиле':'отключён в профиле'}${m.skseDllCount?' · SKSE DLL: '+m.skseDllCount+' (не запускается)':''}${m.pluginCount?' · ESP/ESM/ESL: '+m.pluginCount:''}</small></div><div class="actions"><button class="tiny" aria-label="Переместить выше" onclick="moveMod('${escapeHtml(m.id)}',-1)" ${i===0?'disabled':''}>↑</button><button class="tiny" aria-label="Переместить ниже" onclick="moveMod('${escapeHtml(m.id)}',1)" ${i===data.mods.length-1?'disabled':''}>↓</button><input type="checkbox" class="switch" aria-label="Включить ${escapeHtml(m.name)}" ${m.enabled?'checked':''} onchange="toggleMod('${escapeHtml(m.id)}',this.checked)"/></div></div>`).join(''):`<div class="empty"><span class="ico">▤</span>Моды пока не импортированы.<br>Выбери ZIP-архив для добавления в хранилище лаунчера.</div>`;return `<div class="mods-layout"><div class="mod-column"><h2 class="section-heading"><span class="ico">✥</span>Установленные моды</h2><p class="note">Всего модов: ${data.mods.length} · Включены в профиле: ${enabled}</p>${!isAndroid?'<div class="demo">В браузере показаны демонстрационные моды</div>':''}<div class="modlist">${rows}</div></div><div class="mod-actions"><button class="action" onclick="importMod()">＋ &nbsp; Импортировать ZIP-мод</button><div class="tile"><div class="iconbox">☷</div><div class="copy"><strong>Порядок загрузки</strong><small>Кнопки ↑ и ↓ меняют порядок в профиле</small></div></div><div class="info-panel"><strong>Важно: моды пока не применяются к Skyrim SE.</strong><div>Архивы распаковываются в отдельное хранилище приложения. Включение и порядок сохраняются только в профиле лаунчера.</div></div><div class="info-panel"><strong>SKSE64: пока не поддерживается.</strong><div>Для SKSE64 и Windows-DLL понадобится отдельная техническая адаптация нативного движка.</div></div>${data.mods.length?'<button class="action secondary" onclick="removeLast()">Удалить последний мод из списка</button>':''}</div></div>`;}
function option(value,selected){return `<option value="${escapeHtml(value)}" ${value===selected?'selected':''}>${escapeHtml(value)}</option>`;}
function settingsView(){const s=data.settings;return `<div class="settings-layout"><div class="settings-column"><h2 class="section-heading"><span class="ico">▣</span>Папка игры</h2><p class="note">Укажи установленную Skyrim Special Edition</p><div class="folder-line ${data.folderReady?'':'invalid'}">${escapeHtml(data.gameFolder||'Папка не выбрана')}</div><button class="action" onclick="chooseFolder()">▣ &nbsp; Выбрать папку</button><button class="action secondary" onclick="checkFolder()">✓ &nbsp; Проверить файлы игры</button><div class="status-line">${escapeHtml(data.folderStatus||'Файлы ещё не проверены')}<div>${escapeHtml(data.exeValidation||'EXE ещё не проверен')}</div></div><div class="divider"></div><h3 class="group-title"><span class="ico">▣</span>Графика</h3><div class="form-row"><label for="resolution">Разрешение</label><select class="control" id="resolution" onchange="saveSetting('resolution',this.value)">${['960 × 540','1280 × 720','1600 × 900','1920 × 1080'].map(v=>option(v,s.resolution)).join('')}</select></div><div class="form-row"><label for="quality">Качество графики</label><select class="control" id="quality" onchange="saveSetting('quality',this.value)">${['Низкое','Среднее','Высокое','Ультра'].map(v=>option(v,s.quality)).join('')}</select></div><div class="form-row"><label for="msaa">Сглаживание (MSAA)</label><input class="switch" type="checkbox" id="msaa" ${s.msaa?'checked':''} onchange="saveSetting('msaa',this.checked)"/></div><div class="form-row"><label for="anisotropic">Анизотропная фильтрация</label><input class="switch" type="checkbox" id="anisotropic" ${s.anisotropic?'checked':''} onchange="saveSetting('anisotropic',this.checked)"/></div></div><div class="settings-column"><h3 class="group-title"><span class="ico">✧</span>Управление</h3><div class="form-row"><label for="touch">Сенсорные кнопки</label><input class="switch" type="checkbox" id="touch" ${s.touch?'checked':''} onchange="saveSetting('touch',this.checked)"/></div><div class="form-row"><label for="fps">Ограничение FPS</label><select class="control" id="fps" onchange="saveSetting('fps',this.value)">${['30','40','60','Без ограничения'].map(v=>option(v,s.fps)).join('')}</select></div><div class="divider"></div><div class="tile"><div class="iconbox">≡</div><div class="copy"><strong>Диагностика</strong><small>Проверка подключения движка и файлов</small></div><span class="chev">›</span></div><button class="action secondary" onclick="runDiagnostics()">◉ &nbsp; Проверить ARM64 и Vulkan</button>${diagnosticsPanel()}<button id="resourceInspectorButton" class="action" onclick="openResourceInspector()">▣ &nbsp; Ресурсы Skyrim SE · BSA / NIF (чтение)</button><div class="info-panel"><strong>Ресурсы v2.8</strong><div>Проверка Data, BSA/NIF, каркасный или закрашенный BSTriShape и список путей DDS из BSShaderTextureSet и поиск в BSA каталога Data (без записи в Data).</div></div><button id="vulkan3DTestButton" class="action" onclick="openVulkan3DTest()">◆ &nbsp; 3D-тест Vulkan · OBJ-модели и камера</button>
<div class="info-panel"><strong>3D Vulkan · v2.8</strong><div>Нативный ARM64/Vulkan-рендер поддерживает выбор OBJ-файла и встроенный тестовый куб/пирамиду. OBJ показывается каркасом, NIF BSTriShape — каркасом, поверхностью с DDS и картой нормалей; любой NIF можно выбрать нажатием на имя; части NIF можно смотреть отдельно или вместе (составной режим пока без DDS); компактный 3D-просмотрщик с кнопкой «Параметры»: свет, рельеф и блик доступны без повторной загрузки NIF. Модель можно увеличить кнопкой «Крупнее». Жесты: один палец — камера, два — масштаб. В тесте доступны остановка авто-вращения, ограничение 30/60 FPS, сброс камеры и диагностика. Не запускает Skyrim SE.</div></div>${sceneTestPanel()}<button id="vulkanFrameTestButton" class="action" onclick="openVulkanTest()">◈ &nbsp; Тест Vulkan-кадра (GPU)</button><div class="info-panel"><strong>Отдельный графический стенд</strong><div>На Android откроется экран, где нативная библиотека попытается вывести сиреневый кадр через реальный Vulkan swapchain. Это не Skyrim.</div></div>${frameTestPanel()}<button class="action secondary" onclick="copyDiagnostics()">▤ &nbsp; Скопировать отчёт</button><div class="info-panel"><strong>Нативный движок: не подключён</strong><div>Графические настройки сохраняются, но пока не управляют игрой. Кнопка «Играть» станет доступна только после подключения и проверки движка.</div></div></div></div>`;}
function diagnosticsPanel(){
  const r=data.runtime||{};
  const show=(value)=>escapeHtml(String(value??'—'));
  const mark=(passed)=>passed?'<b class="diag-ok">Да</b>':'<b class="diag-no">Нет</b>';
  const row=(label,value)=>`<div class="diag-row"><span>${escapeHtml(label)}</span>${value}</div>`;
  return `<section class="diag-card" aria-label="Проверка устройства"><div class="diag-title">ARM64 / Vulkan · ${r.state==='checking'?'проверка…':r.state==='done'?'проверено':'не проверено'}</div>
  ${row('Архитектура ARM64',r.state==='done'?mark(r.arm64):'<b class="diag-pending">—</b>')}
  ${row('Нативная библиотека JNI',r.state==='done'?mark(r.nativeLibraryLoaded):'<b>—</b>')}
  ${row('Vulkan 1.1 или выше',r.state==='done'?mark(r.vulkan11):'<b>—</b>')}
  ${row('GPU',`<b>${show(r.gpuName||'Не определён')}</b>`)}
  ${row('Версия Vulkan устройства',`<b>${show(r.apiVersion||'—')}</b>`)}
  <div class="diag-note">${show(r.message||'Диагностика ещё не запускалась')}<div>Это проверка возможностей телефона, а не запуск игры или тест рендера.</div></div></section>`;
}
function frameTestPanel(){
  const r=data.frameTest;
  if(!r)return '<div class="diag-card" id="frameTestResult"><div class="diag-title">Vulkan Surface · кадр ещё не проверен</div><div class="diag-note">После теста результат сохраняется и появится здесь.</div></div>';
  const success=Boolean(r.success);
  return `<div class="diag-card" id="frameTestResult"><div class="diag-title">Реальный вывод кадра · <span class="${success?'diag-ok':'diag-no'}">${success?'Отправлен':'Ошибка'}</span></div>
  <div class="diag-note">${escapeHtml(r.message||'Нет подробностей')}<div>${success?escapeHtml((r.width||'—')+' × '+(r.height||'—')+' · '+(r.gpu||'GPU не определён')):''}</div><div>Положительный результат НЕ означает поддержку Skyrim SE.</div></div></div>`;
}
function sceneTestPanel(){
  const r=data.sceneTest;
  if(!r)return '<div class="diag-card"><div class="diag-title">3D-сцена · тест ещё не выполнялся</div></div>';
  return `<div class="diag-card"><div class="diag-title">3D Vulkan · ${r.error?'ошибка':r.frames>0?'кадры выведены':'не готово'}</div><div class="diag-note">${escapeHtml(r.message||'—')} · ${escapeHtml(String(r.frames||0))} кадров · FPS: ${escapeHtml(String(r.fps||0))} · ${escapeHtml(String(r.width||0))}×${escapeHtml(String(r.height||0))}</div></div>`;
}
function openResourceInspector(){
  if(isAndroid){AndroidBridge.openResourceInspector();}
  else{notify("Инспектор ресурсов доступен в Android APK");}
}
function openVulkan3DTest(){
  if(isAndroid){AndroidBridge.openVulkan3DTest();}
  else notify('3D Vulkan-тест доступен в Android APK, не в браузерном макете.');
}
function openVulkanTest(){
  if(isAndroid){AndroidBridge.openVulkanTest();}
  else notify('Реальный тест Vulkan-кадра доступен только в Android APK. Браузерный макет не запускает GPU-тест.');
}
function runDiagnostics(){if(isAndroid){AndroidBridge.runDiagnostics();notify('Проверяю процессор и Vulkan…');}else notify('Реальная диагностика доступна только в Android APK.');}
function copyDiagnostics(){if(isAndroid){AndroidBridge.copyDiagnostics();}else notify('Отчёт с реального устройства доступен только в APK.');}
function chooseFolder(){if(isAndroid){AndroidBridge.chooseFolder();}else notify('Выбор папки работает в Android-приложении; браузер — только превью.');}
function checkFolder(){if(isAndroid){AndroidBridge.checkFolder();}else notify('В браузере проверка файлов игры недоступна.');}
function importMod(){if(isAndroid)AndroidBridge.importMod();else document.getElementById('previewZip').click();}
function previewImport(e){const file=e.target.files[0];if(!file)return;data.mods.push({id:'preview'+Date.now(),name:file.name,enabled:false,files:0});render();notify('Демо: добавлено имя архива; файлы не распакованы.');e.target.value='';}
function toggleMod(id,enabled){const mod=data.mods.find(m=>m.id===id);if(mod)mod.enabled=enabled;if(isAndroid)AndroidBridge.setModEnabled(id,enabled);render();}
function moveMod(id,direction){const i=data.mods.findIndex(m=>m.id===id),j=i+direction;if(i<0||j<0||j>=data.mods.length)return;[data.mods[i],data.mods[j]]=[data.mods[j],data.mods[i]];if(isAndroid)AndroidBridge.saveModOrder(data.mods.map(m=>m.id).join(','));render();}
function removeLast(){if(!data.mods.length)return;const mod=data.mods[data.mods.length-1];if(!confirm('Удалить '+mod.name+' из хранилища лаунчера?'))return;if(isAndroid){AndroidBridge.deleteMod(mod.id);}else{data.mods.pop();render();}}
function saveSetting(key,value){data.settings[key]=value;if(isAndroid)AndroidBridge.saveSetting(key,String(value));}
function playGame(){if(isAndroid)AndroidBridge.launch();else notify('Нативный движок пока не подключён.',true);}
window.nativeRefresh=()=>{if(isAndroid)receiveState(JSON.parse(AndroidBridge.getState()));};window.nativeNotify=notify;
window.addEventListener('orientationchange',()=>setTimeout(render,130));
render();requestState();
</script>
</body></html>

plugins { id 'com.android.application' }

android {
    namespace 'dev.skyrimsemobile.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.skyrimsemobile.launcher'
        minSdk 26
        targetSdk 34
        versionCode 69
        versionName '2.46.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            // Release APK is ARM64-only; x86_64 is added only for emulator CI.
            abiFilters 'arm64-v8a'
            if (project.hasProperty('ciEmulator')) abiFilters 'x86_64'
        }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra' }
        }
    }

    // Fixed test-only signing certificate stored in this PRIVATE repository.
    // Do not regenerate or future APKs will no longer upgrade in place.
    signingConfigs {
        stableDebug {
            storeFile rootProject.file('../.ci/skyrimse-mobile-test.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stableDebug }
        release { signingConfig signingConfigs.stableDebug } // test-only, NOT a production release
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Skyrim SE BSA 105 uses LZ4 frame compression; use pure-Java decoder on ARM64.
dependencies {
    implementation 'org.lz4:lz4-java:1.8.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


// Download actual dependency JAR files, not just Gradle metadata (JVM CI needs LZ4).
tasks.register('resolveRuntimeJars') {
    doLast {
        configurations.debugRuntimeClasspath.resolve().each { file ->
            println("Runtime JAR: " + file.getName())
        }
    }
}
